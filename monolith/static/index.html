<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupsApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #16213e; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #0f3460; color: #4a90d9; font-size: 1.4rem; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background: #4a90d9; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: #16213e; padding: 16px; overflow-y: auto; border-right: 1px solid #0f3460; }
        .sidebar h3 { color: #4a90d9; margin-bottom: 12px; font-size: 0.9rem; text-transform: uppercase; }
        .group-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; background: #0f3460; transition: background 0.2s; }
        .group-item:hover, .group-item.active { background: #4a90d9; }
        .chat { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid #0f3460; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 60%; padding: 10px 14px; border-radius: 12px; }
        .message.sent { background: #4a90d9; align-self: flex-end; }
        .message.received { background: #0f3460; align-self: flex-start; }
        .message .meta { font-size: 0.75rem; opacity: 0.7; margin-top: 4px; }
        .input-area { padding: 16px; background: #16213e; display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 0.95rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-box { background: #16213e; padding: 32px; border-radius: 12px; width: 360px; }
        .modal-box h2 { color: #4a90d9; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #aaa; }
        .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 8px 16px; border-radius: 6px; cursor: pointer; background: #0f3460; }
        .tab.active { background: #4a90d9; }
        .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #555; font-size: 1.1rem; }
        #toast { position: fixed; bottom: 24px; right: 24px; background: #2ecc71; color: white; padding: 12px 20px; border-radius: 8px; display: none; z-index: 200; }
        #toast.error { background: #e74c3c; }
    </style>
</head>
<body>

<div class="header">
    <h1>💬 GroupsApp</h1>
    <div id="userInfo" style="display:flex;align-items:center;gap:12px;">
        <span id="usernameDisplay"></span>
        <button class="btn btn-danger" onclick="logout()" id="logoutBtn" style="display:none">Cerrar sesión</button>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <h3>Grupos</h3>
        <button class="btn btn-primary" style="width:100%;margin-bottom:12px;" onclick="showCreateGroup()">+ Nuevo grupo</button>
        <div id="groupsList"></div>
    </div>
    <div class="chat" id="chatArea">
        <div class="empty-state">Selecciona un grupo para chatear</div>
    </div>
</div>

<!-- Modal Auth -->
<div class="modal active" id="authModal">
    <div class="modal-box">
        <h2>GroupsApp</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Iniciar sesión</div>
            <div class="tab" onclick="switchTab('register')">Registrarse</div>
        </div>
        <div id="loginForm">
            <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="tu@email.com"></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
            <button class="btn btn-primary" style="width:100%" onclick="login()">Entrar</button>
        </div>
        <div id="registerForm" style="display:none">
            <div class="form-group"><label>Username</label><input type="text" id="regUsername" placeholder="camilo123"></div>
            <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="tu@email.com"></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="regPassword" placeholder="••••••••"></div>
            <button class="btn btn-primary" style="width:100%" onclick="register()">Registrarse</button>
        </div>
    </div>
</div>

<!-- Modal Crear Grupo -->
<div class="modal" id="createGroupModal">
    <div class="modal-box">
        <h2>Nuevo Grupo</h2>
        <div class="form-group"><label>Nombre</label><input type="text" id="groupName" placeholder="Mi grupo"></div>
        <div class="form-group"><label>Descripción</label><input type="text" id="groupDesc" placeholder="Descripción opcional"></div>
        <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn btn-primary" style="flex:1" onclick="createGroup()">Crear</button>
            <button class="btn btn-danger" style="flex:1" onclick="closeCreateGroup()">Cancelar</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const API = 'http://localhost:8000';
    let token = localStorage.getItem('token');
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    let currentGroup = null;
    let refreshInterval = null;

    function showToast(msg, error=false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = error ? 'error' : '';
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    async function register() {
        const username = document.getElementById('regUsername').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const res = await fetch(`${API}/auth/register`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password})
        });
        const data = await res.json();
        if (res.ok) { showToast('Registro exitoso. Inicia sesión.'); switchTab('login'); }
        else showToast(data.detail || 'Error al registrarse', true);
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const res = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (res.ok) {
            token = data.access_token;
            localStorage.setItem('token', token);
            const users = await (await fetch(`${API}/users/`)).json();
            currentUser = users.find(u => u.email === email);
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            document.getElementById('authModal').classList.remove('active');
            document.getElementById('usernameDisplay').textContent = currentUser.username;
            document.getElementById('logoutBtn').style.display = 'block';
            loadGroups();
            showToast('Bienvenido ' + currentUser.username);
        } else showToast(data.detail || 'Credenciales invalidas', true);
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('currentUser');
        token = null; currentUser = null; currentGroup = null;
        clearInterval(refreshInterval);
        document.getElementById('authModal').classList.add('active');
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('usernameDisplay').textContent = '';
        document.getElementById('groupsList').innerHTML = '';
        document.getElementById('chatArea').innerHTML = '<div class="empty-state">Selecciona un grupo para chatear</div>';
    }

    async function loadGroups() {
        const res = await fetch(`${API}/groups/`);
        const groups = await res.json();
        const list = document.getElementById('groupsList');
        list.innerHTML = '';
        groups.forEach(g => {
            const div = document.createElement('div');
            div.className = 'group-item' + (currentGroup?.id === g.id ? ' active' : '');
            div.textContent = g.name;
            div.onclick = () => openGroup(g);
            list.appendChild(div);
        });
    }

    function openGroup(group) {
        currentGroup = group;
        clearInterval(refreshInterval);
        document.querySelectorAll('.group-item').forEach(i => i.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('chatArea').innerHTML = `
            <div class="chat-header"><strong>${group.name}</strong> — ${group.description || ''}</div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
            </div>
        `;
        loadMessages();
        refreshInterval = setInterval(loadMessages, 3000);
    }

    async function loadMessages() {
        if (!currentGroup) return;
        const res = await fetch(`${API}/messages/group/${currentGroup.id}`);
        const msgs = await res.json();
        const container = document.getElementById('messages');
        if (!container) return;
        container.innerHTML = '';
        msgs.forEach(m => {
            const div = document.createElement('div');
            div.className = 'message ' + (m.sender_id === currentUser?.id ? 'sent' : 'received');
            div.innerHTML = `<div>${m.content}</div><div class="meta">${new Date(m.created_at).toLocaleTimeString()}</div>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const content = input.value.trim();
        if (!content || !currentGroup || !currentUser) return;
        await fetch(`${API}/messages/?sender_id=${currentUser.id}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content, message_type: 'text', group_id: currentGroup.id, channel_id: null, receiver_id: null})
        });
        input.value = '';
        loadMessages();
    }

    function showCreateGroup() {
        if (!currentUser) { showToast('Inicia sesión primero', true); return; }
        document.getElementById('createGroupModal').classList.add('active');
    }

    function closeCreateGroup() {
        document.getElementById('createGroupModal').classList.remove('active');
    }

    async function createGroup() {
        const name = document.getElementById('groupName').value;
        const description = document.getElementById('groupDesc').value;
        if (!name) { showToast('El nombre es obligatorio', true); return; }
        const res = await fetch(`${API}/groups/?created_by=${currentUser.id}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, description, group_type: 'public'})
        });
        if (res.ok) {
            closeCreateGroup();
            loadGroups();
            showToast('Grupo creado exitosamente');
        } else showToast('Error al crear grupo', true);
    }

    if (token && currentUser) {
        document.getElementById('authModal').classList.remove('active');
        document.getElementById('usernameDisplay').textContent = currentUser.username;
        document.getElementById('logoutBtn').style.display = 'block';
        loadGroups();
    }
</script>
</body>
</html>
