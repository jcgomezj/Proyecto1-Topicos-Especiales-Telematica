services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: groupsapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  monolith:
    build:
      context: ./monolith
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/groupsapp
      - SECRET_KEY=supersecretkey123
    depends_on:
      - db

  auth_service:
    build:
      context: ./auth_service
    ports:
      - "8001:8001"
      - "50051:50051"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/groupsapp
      - SECRET_KEY=supersecretkey123
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - db

  user_service:
    build:
      context: ./user_service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/groupsapp
    depends_on:
      - db

  group_service:
    build:
      context: ./group_service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/groupsapp
    depends_on:
      - db

  messaging_service:
    build:
      context: ./messaging_service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/groupsapp
      - AUTH_GRPC_HOST=auth_service
      - AUTH_GRPC_PORT=50051
    depends_on:
      - db
      - auth_service

volumes:
  postgres_data:
